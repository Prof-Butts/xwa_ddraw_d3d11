; SSAO / SSDO / Deferred Shading config file.
ssao_enabled = 1

keep_mouse_inside_window = 1

; Select the shading style:
; "Deferred" for regular deferred shading with specular highlights - fastest mode; but no ambient occlusion.
;  Raytracing only works when ssao_type is set to Deferred or PBR
; "PBR" for physically-based shading: energy-conserving materials, exact sRGB colors and
;  filmic tonemapping. Use pbr_exposure to adjust the brightness. Press Ctrl+Alt+M in
;  game to compare it with the legacy shading used by "Deferred" with raytracing.
; "Ambient" for regular Ambient Occlusion.
; "Directional" for SSDO (Screen-Space Directional Occlusion).
ssao_type = Deferred

; Number of samples. The higher the count, the higher the quality and the bigger the spread.
samples = 8

; Distance in meters where the effect will be cut off.
max_dist = 150

; Controls the width of the occlusion cone considered by the occludee.
; A value of 0 makes a 90 deg "cone". A value of 1 makes a 0 degree cone.
bias = 0.05

; The overall intensity of the SSAO/SSDO effect, like the "contrast" of the effect.
intensity = 4.0

; Enhance the contrast by raising the shadows to this power. Set it to 1.0 to disable it.
power = 2.0

; Defines the blackest level for the SSAO effect. 1 is white, 0 is fully black. This setting is ignored for SSDO.
black_level = 0.2

; Sampling Radius for SSAO/SSDO: Controls the spread of the effect. The following looks good for 8 samples:
near_sample_radius = 0.005
far_sample_radius = 0.005

; Set the following parameter to "2" to perform SSAO/SSDO on a buffer half the size.
ssao_buffer_scale_divisor = 2

; Set the following to 1 to blur the SSAO buffer (removes noise).
enable_blur = 1

; For SSDO you can have multiple blur passes at the cost of performance.
blur_passes = 1

; Enable indirect lighting for SSDO. This setting can also be toggled by pressing Ctrl+Alt+P while flying.
enable_indirect_ssdo = 0

; The intensity of the indirect lighting effect:
indirect_intensity = 1.0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Normal Mapping
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Enable Normal Mapping. Press Ctrl+Alt+N to toggle it while flying.
normal_mapping_enable = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Specular Shading settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; The following are generic settings. Individual materials can be defined per-texture per-OPT.
specular_intensity = 0.5

; If the specular component is too bright, it will "spill out" as bloom. This setting controls the intensity of this "spillover bloom".
specular_bloom_intensity = 1.2

; Generic maximum glossiness of all surfaces.
glossiness = 128.0

; Generic glossiness of the specular bloom. This value multiplies the "glossiness" setting.
bloom_glossiness_multiplier = 3.0 

; The generic specular model creates a specular component automatically using the original color from the texture.
; Lightness should be numbers above 1 to increase the specular component.
; A value of 1 uses the original color for the specular component, and a value of 0 creates a matte look.
lightness_boost  = 8.0

; A saturation of 0 provides a white specular component, like plastic and wood.
; A saturation above 1 produces a metallic look.
saturation_boost = 1.0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; SSDO Lighting System Parameters
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; 1 = Original saturation. 0 = All lights become grayscale
xwa_lights_saturation = 1.0

; Intensity multiplier: If the lights seem too dark, you can increase their power by setting the following above 1.
xwa_lights_global_intensity = 1.0

; XWA's background suns have been updated. They are now animated and generated procedurally.
procedural_suns = 1

; Controls the intensity of the flare produced by background suns.
flare_intensity = 3

; Laser / Ion lights settings.
; ssao_type = PBR uses pbr_laser_light_intensity instead of laser_light_intensity.
enable_laser_lights = 1
laser_light_intensity = 3.0

; General Ambient Lighting value. Set this to a low value.
; ssao_type = PBR uses pbr_ambient (and pbr_hangar_ambient) instead.
ambient = 0.02

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Headlights
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; The position of the headlights (X,Y,Z), in meters. Z positive is in front of your ship.
headlights_pos = 0, 0, 20.0

; The color of the headlights. These are RGB values in the range 0..1
headlights_col = 0.85, 0.85, 0.9

; The ambient value to use when the headlights are on.
headlights_ambient = 0.05

; The distance where the headlights will vanish, in meters.
headlights_distance = 1500.0

; The width of the cone projected by the headlights, in degrees.
headlights_angle = 70.0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Speed Effect -- Additional small debris that moves with speed.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; 

enable_speed_shader = 1

; This is the intensity of the debris. 1 is pure white and 0 will show nothing.
speed_shader_max_intensity = 0.6

; The maximum number of debris particles.
speed_shader_max_particles = 256

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Shadow Mapping
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

shadow_mapping_enable = 1

; This setting prevents self-shadowing. Set it to a small value.
shadow_mapping_bias = -0.03

; This defines the "hardness" of the shadow. Bigger values make softer shadows. I use values between 0.0025 and 0.00125.
shadow_mapping_pcss_radius = 0.00125

; In order to remove noise in the shadows, we need to sample the edges a few times: more samples = softer edges; but lower performance.
shadow_mapping_pcss_samples = 2

; This is the blackest a shadow will become.
shadow_mapping_black_level = 0.2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Ray Tracing Settings. Ray Tracing only works when ssao_type is set to Deferred
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Enable Ray Tracing = 1. Disable = 0. (Default is off)
raytracing_enabled = 1

; Enable / Disable Ray Tracing in Tech Room. Disable = 0.
raytracing_enabled_in_tech_room = 1

; RT uses High Dynamic Range lighting.
HDR_enabled = 1

; This controls the intensity of the suns. Set it to 1.0 to disable it.
; ssao_type = PBR uses pbr_lights_intensity instead.
HDR_lights_intensity = 2.5

; The following settings work like their pbr_* versions below, but for the other shading
; modes (ssao_type = Deferred, Directional and Bent_Normals). The defaults don't change
; anything.

; Overall brightness. Higher values make the image brighter.
exposure = 1.0

; Tints the suns. For instance, 1.0, 0.95, 0.85 gives a warmer light.
lights_color = 1.0, 1.0, 1.0

; Tints the ambient light (the light in the shadows). For instance, 0.75, 0.85, 1.0 gives
; bluish shadows.
ambient_color = 1.0, 1.0, 1.0

; How dark black areas in the textures can be, in linear units. Values between 0.03 and
; 0.05 keep black lines and panels from looking like holes. 0 disables it.
min_albedo = 0.0

; The following pbr_* settings are only used when ssao_type = PBR. The other shading
; modes (and the legacy PBR shading, see Ctrl+Alt+M) keep using the original settings,
; so both can be tuned separately.

; Overall brightness when ssao_type = PBR. Higher values make the image brighter.
pbr_exposure = 1.0

; The intensity of the suns when ssao_type = PBR. Replaces HDR_lights_intensity.
pbr_lights_intensity = 2.5

; Tints the suns when ssao_type = PBR. For instance, 1.0, 0.95, 0.85 gives a warmer light.
; Values below 1 also make the light dimmer, so pbr_lights_intensity may need to go up a
; little. 1, 1, 1 disables it.
pbr_lights_color = 1.0, 1.0, 1.0

; The ambient light when ssao_type = PBR: the light in the shadows. Replaces ambient.
; It's used with and without cubemaps. A cubemap adds its own light on top of it
; (AllRegionsAmbientInt) and its reflections (AllRegionsSpecular); AllRegionsAmbientMin
; isn't used in this mode.
pbr_ambient = 0.02

; The ambient light in the hangar when ssao_type = PBR. Replaces hangar_ambient.
pbr_hangar_ambient = 0.05

; The intensity of the laser and ion lights when ssao_type = PBR. Replaces
; laser_light_intensity.
pbr_laser_light_intensity = 3.0

; How dark black areas in the textures can be when ssao_type = PBR, in linear units.
; Real materials are rarely darker than 0.03, so values between 0.03 and 0.05 keep
; black lines and panels from looking like holes. The other colors are scaled to fit,
; so dark details are kept. 0 disables it.
pbr_min_albedo = 0.0

; Tints the ambient light when ssao_type = PBR. The ambient is the light in the
; shadows, so a value like 0.75, 0.85, 1.0 gives bluish shadows. It also tints the
; cubemap's ambient light (but not its reflections). 1, 1, 1 disables it.
pbr_ambient_color = 1.0, 1.0, 1.0

; Ambient occlusion when ssao_type = PBR (GTAO, with bent normals). It darkens the ambient
; light and the reflections in crevices, gaps and corners, and the cubemap's ambient light
; comes from the least occluded direction. The sun isn't affected: it has real shadows.
; Ctrl+Alt+J turns it on and off in game (only when ssao_type = PBR). Needs ssao_enabled = 1.
pbr_gtao_enabled = 0
; How far the occluders can be, in meters.
pbr_gtao_radius = 1.0
; Higher values make the occlusion darker. 1 is the physically based amount.
pbr_gtao_intensity = 1.5
; The radius is kept between these sizes on the screen, in pixels: close surfaces don't
; sample half of the screen, and far ships still get some occlusion.
pbr_gtao_min_radius_px = 4
pbr_gtao_max_radius_px = 64
; Quality: directions searched per pixel (1-8) and samples per direction (1-16). The cost
; grows with slices x steps.
pbr_gtao_slices = 3
pbr_gtao_steps = 4
; Debug: measures how long the PBR lighting takes on the GPU, split into GTAO, its denoise
; filter and the lighting pass. Every 5 seconds it shows the total on screen and writes
; the details to the log with the "[DBG] [GTAO]" tag. Press Ctrl+Alt+J to compare the
; times with and without GTAO.
pbr_gtao_gpu_timer = 0

; Color grading when ssao_type = PBR: a final adjustment of the colors of the lit
; surfaces, like the color grade of a film. The background and the shadeless surfaces
; (displays, engine glows) aren't changed. With the values below it does nothing.
; - pbr_grade_contrast: above 1 darkens the dark tones and brightens the bright ones,
;   below 1 does the opposite.
; - pbr_grade_saturation: 0 makes the colors gray, above 1 makes them stronger.
; - pbr_grade_shadows, pbr_grade_highlights: tints for the dark and the bright tones (split
;   toning), blended in between. They change the color, not the brightness, so only the
;   ratio between R, G and B matters. For instance, 1.0, 0.8, 0.9 gives mauve shadows.
pbr_grade_contrast = 1.0
pbr_grade_saturation = 1.0
pbr_grade_shadows = 1.0, 1.0, 1.0
pbr_grade_highlights = 1.0, 1.0, 1.0

; Debug: move the sun with hotkeys. When this is 1, the brightest light starts at the
; game's sun direction and these keys nudge it (in XWA's world coordinates):
;   Ctrl+Alt+Shift+Right/Left: X +/-
;   Ctrl+Alt+Shift+Up/Down:    Y +/-
;   Ctrl+Up/Down:              Z +/-
; The arrow keys stop adjusting the FOV while this is enabled. The lighting and the
; shadows move, but the sun in the background doesn't.
override_game_light_pos = 0

; Enable Ray Traced shadows inside the cockpit. This incurs a noticeable impact in performance, but all cockpits get shadows automatically.
raytracing_enabled_in_cockpit = 1

; Embree is the industry standard for Ray Tracing. Enabling it makes RT a little faster in XWA.
raytracing_enable_embree = 1

; Enable / Disable soft Ray Traced shadows.
raytracing_enable_soft_shadows = 1

; To make RT faster, shadows are computed on a smaller image. 4 means 1/4 the size. Only used if soft shadows are enabled.
raytracing_shadow_mask_size_factor = 4

; 1 = Sharp shadows, 0 = Soft shadows
raytracing_soft_shadow_sharpness = 0.5

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;For more information see the files in Readme\Special Effects\

